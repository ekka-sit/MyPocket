<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Pocket - Personal Expense Tracker</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>

  <div class="app-overlay" id="overlay"></div>

  <aside class="sidebar" id="sidebar" aria-hidden="true">
    <nav class="sidebar-nav">
      <a href="#" class="sidebar-link active" data-page="home">Home</a>
      <a href="#" class="sidebar-link" data-page="calendar">Calender</a>
      <a href="#" class="sidebar-link" data-page="statistic">Statistic</a>
    </nav>
  </aside>

  <div class="app-shell" id="appShell">

    <header class="app-header">
      <button type="button" class="menu-toggle" id="menuToggle" aria-label="เปิดเมนู" aria-expanded="false" aria-controls="sidebar">
        <span class="menu-icon menu-icon--bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
        </span>
        <span class="menu-icon menu-icon--arrow" aria-hidden="true">&#9654;</span>
      </button>

      <div class="header-year-wrap">
        <button type="button" class="header-year" id="yearTrigger" aria-haspopup="listbox" aria-expanded="false">2026</button>
        <ul class="picker-list" id="yearList" role="listbox" tabindex="-1" hidden></ul>
      </div>

      <div class="header-brand">
        <span class="header-brand-text">My Pocket</span>
      </div>
    </header>

    <main class="content">
      <div class="page-container">

        <div class="month-summary-row">
          <div class="month-picker-wrap">
            <button type="button" class="month-label" id="monthTrigger" aria-haspopup="listbox" aria-expanded="false">Sep</button>
            <ul class="picker-list" id="monthList" role="listbox" tabindex="-1" hidden></ul>
          </div>

          <!-- Pocket Badge (3 โหมด: Expense / Income / Net Income) -->
          <button type="button" class="pocket-badge" id="pocketBadge" data-mode="expense" aria-label="สลับโหมดPocket Badge">
            <span class="pocket-badge-inner" id="pocketBadgeInner">
              <span class="pocket-badge-face pocket-badge-face--expense">
                <img src="images/pocket.png" alt="" class="pocket-badge-icon">
                <span class="pocket-badge-amount" id="expenseAmount">0</span>
              </span>
              <span class="pocket-badge-face pocket-badge-face--income">
                <img src="images/pocket_in.png" alt="" class="pocket-badge-icon">
                <span class="pocket-badge-amount" id="incomeAmount">0</span>
              </span>
              <span class="pocket-badge-face pocket-badge-face--net">
                <img src="images/sum.png" alt="" class="pocket-badge-icon">
                <span class="pocket-badge-amount" id="netAmount">0</span>
              </span>
            </span>
          </button>
        </div>

        <!-- หน้า Home View (รายการแบบ Accordion) -->
        <div class="day-list" id="dayList"></div>

        <!-- หน้า Calendar View (ตารางปฏิทิน) -->
        <div class="calendar-view hidden" id="calendarView"></div>

      </div>
    </main>

  </div>

  <!-- Floating Action Button -->
  <button type="button" class="fab" id="fabAdd" aria-label="เพิ่มรายการ">
    <span id="fabIcon" aria-hidden="true">+</span>
  </button>

  <!-- Modal ฟอร์มบันทึก / ดูรายละเอียดรายการ (Home View) -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div id="transactionModal" class="modal-card modal-expense">
      
      <button type="button" id="closeModalBtn" class="modal-close-tab" aria-label="ปิดหน้าต่าง">✕</button>

      <div class="modal-header-custom">
        <div id="dateDisplay" class="date-picker-trigger">
          <span id="dateText">25 / Sep / 2026</span>
          <input type="date" id="hiddenDatePicker" class="hidden-date-input">
        </div>
        <div class="modal-header-actions">
          <button type="button" id="typeToggleBtn" class="type-toggle-btn">รายจ่าย</button>
          <button type="button" id="deleteTxBtn" class="delete-tx-btn hidden" aria-label="ลบรายการ">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d9534f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
          </button>
        </div>
      </div>

      <div id="modalBody" class="modal-body-container">
        <div class="modal-col-left">
          <div id="amountBoxContainer" class="amount-display-container">
            <button type="button" id="editAmountConfirmBtn" class="amount-action-btn edit-confirm-btn hidden" aria-label="ยืนยันยอดเงิน">
              <img src="images/correct.png" alt="ตกลง">
            </button>
            <div id="amountDisplay" class="amount-display">0</div>
            <button type="button" id="amountDeleteBtn" class="amount-action-btn delete-num-btn" aria-label="ลบตัวเลข">
              <img src="images/delete_btn.png" alt="ลบ">
            </button>
          </div>

          <div id="formInputsGroup" class="form-inputs">
            <div class="input-group-custom" id="categoryGroup">
              <label for="categorySelect">หมวดหมู่</label>
              <select id="categorySelect" class="form-control-custom">
                <option value="" disabled selected>เลือกหมวดหมู่</option>
              </select>
            </div>

            <div class="input-group-custom" id="noteGroup">
              <label for="noteInput">หมายเหตุ</label>
              <input type="text" id="noteInput" class="form-control-custom" placeholder="กรอกหมายเหตุ (เช่น อาหารเย็น)">
            </div>

            <div id="addModeImageSection" class="image-upload-section">
              <button type="button" id="cameraBtn" class="camera-btn">📷 ถ่ายภาพ / อัปโหลดใบเสร็จ</button>
              <input type="file" id="receiptInput" accept="image/*" hidden>
              <div id="imagePreviewContainer" class="image-preview-container hidden">
                <img id="imagePreview" src="" alt="ใบเสร็จ">
                <button type="button" id="removeImageBtn" class="remove-img-btn">&times;</button>
              </div>
            </div>
          </div>

          <div id="numpadGrid" class="numpad-grid">
            <button type="button" class="numpad-btn" data-val="7">7</button>
            <button type="button" class="numpad-btn" data-val="8">8</button>
            <button type="button" class="numpad-btn" data-val="9">9</button>
            <button type="button" class="numpad-btn op-btn" data-val="+">+</button>

            <button type="button" class="numpad-btn" data-val="4">4</button>
            <button type="button" class="numpad-btn" data-val="5">5</button>
            <button type="button" class="numpad-btn" data-val="6">6</button>
            <button type="button" class="numpad-btn op-btn" data-val="-">-</button>

            <button type="button" class="numpad-btn" data-val="1">1</button>
            <button type="button" class="numpad-btn" data-val="2">2</button>
            <button type="button" class="numpad-btn" data-val="3">3</button>
            <button type="button" class="numpad-btn op-btn" data-val="*">&times;</button>

            <button type="button" class="numpad-btn" data-val="0">0</button>
            <button type="button" class="numpad-btn" data-val=".">.</button>
            <button type="button" class="numpad-btn action-btn" data-val="=">=</button>
            <button type="button" class="numpad-btn op-btn" data-val="/">&divide;</button>
          </div>
        </div>

        <div id="modalColRight" class="modal-col-right hidden">
          <div class="receipt-card-container">
            <button type="button" id="detailCameraBtn" class="detail-camera-btn" aria-label="ถ่ายภาพ/อัปโหลด">📷</button>
            <input type="file" id="detailReceiptInput" accept="image/*" hidden>
            <div id="detailImageWrapper" class="detail-image-wrapper">
              <img id="detailImagePreview" src="" alt="ใบเสร็จ" class="hidden">
              <span id="noImageText" class="no-image-text">ไม่มีรูปภาพ</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Modal ดูรายละเอียดประจำวันสำหรับหน้า Calendar (CalendarDailyModal) -->
  <div id="calendarDailyModalOverlay" class="modal-overlay hidden">
    <div id="calendarDailyModal" class="modal-card modal-calendar-daily">
      <button type="button" id="closeCalendarDailyModalBtn" class="modal-close-tab" aria-label="ปิดหน้าต่าง">✕</button>
      <div class="modal-header-custom">
        <div class="date-picker-trigger">
          <span id="calendarDailyDateText">25 / Sep / 2026</span>
        </div>
      </div>
      <div id="calendarDailyBody" class="modal-body-container">
        <!-- รายการ Tree View จะถูกวาดโดย calendar.js -->
      </div>
    </div>
  </div>

  <!-- Mini Modal (+ เพิ่มหมวดหมู่ใหม่) -->
  <div id="miniModalOverlay" class="mini-modal-overlay hidden">
    <div class="mini-modal-card">
      <h3>เพิ่มหมวดหมู่ใหม่</h3>
      <input type="text" id="newCategoryInput" class="form-control-custom" placeholder="ชื่อหมวดหมู่...">
      <div class="mini-modal-actions">
        <button type="button" id="cancelCategoryBtn" class="btn-secondary-custom">ยกเลิก</button>
        <button type="button" id="saveCategoryBtn" class="btn-primary-custom">บันทึก</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
  <script src="js/calendar.js"></script>
</body>
</html>
